name: Dependabot auto-merge

on: pull_request

# Not cancelling, unlike ci.yml: the job below is a two-write sequence, and a
# cancel landing between them leaves the pull request approved with auto-merge
# never enabled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Read-only: the writes below are made with the App token, not with this.
permissions:
  contents: read

jobs:
  auto-merge:
    name: Auto-merge
    runs-on: ubuntu-latest
    # The actor, not the pull request's author: a commit a person pushes onto a
    # Dependabot branch fires synchronize with that person as the actor, and
    # approving there would put their name on a review they did not give.
    if: github.actor == 'dependabot[bot]'
    steps:
      # Not GITHUB_TOKEN: the ruleset requires an approving review and "Allow
      # GitHub Actions to create and approve pull requests" is off, so it
      # cannot approve at all; and a merge auto-merge performs on its behalf
      # emits no push event, which would leave release.yml unrun and tagpr's
      # release pull request stale.
      #
      # Dependabot-triggered runs see Dependabot secrets rather than Actions
      # secrets, so the private key is registered under both names. Without the
      # Dependabot one this step is where the workflow fails.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      # No checkout anywhere above, so nothing from the pull request head
      # executes here.
      #
      # --merge because the ruleset allows no other method, and no update-type
      # filter on top of it because the required checks are the gate.
      - env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --merge "$PR_URL"
