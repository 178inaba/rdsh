version: "2"

# Without this the e2e suite goes unlinted: golangci-lint analyses only the
# files the default build tags select, and every file under e2e/ is behind
# the `e2e` tag.
run:
  build-tags:
    - e2e

# The linter set is enumerated rather than inherited from the running version's
# own default, so a golangci-lint upgrade changes diagnostics but never which
# linters are active.
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - revive
    - staticcheck
    - unused
  settings:
    errcheck:
      # Informational writes to stdout/stderr and best-effort cleanup where
      # there is no meaningful recovery from a failure.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - os.Unsetenv
        - (io.ReadCloser).Close

# The two defaults below hide findings rather than cap noise: golangci-lint
# stops after three issues sharing one message and after fifty from one
# linter, so eight identical unused-parameter reports arrive as three. The
# enumerated set above is only worth enumerating if all of what it finds is
# reported.
issues:
  max-same-issues: 0
  max-issues-per-linter: 0

# `golangci-lint run` reports a formatter's findings as ordinary issues, so the
# existing Lint job and `docker compose run --rm lint` already fail on
# unformatted code and ci.yml needs no gofmt step of its own. Only gofmt is
# enabled: goimports, gofumpt and golines each impose a style beyond what
# `go fmt` itself defines.
formatters:
  enable:
    - gofmt
